{% extends "templates/web.html" %}
{% block title %}Sample Tracking — InstaCertify{% endblock %}
{% block page_content %}
<link rel="stylesheet" href="/assets/instacertify/css/instacertify_web.css">
<div class="ic-portal"><div class="ic-portal-shell">
<div class="ic-portal-brand"><div class="logo">InstaCertify</div><div>Sample Tracking</div></div>
<div class="ic-portal-card">
	<div id="ic-loading">Tracking sample…</div>
	<div id="ic-content" style="display:none;">
		<h1 id="s-title"></h1>
		<div class="ic-meta">
			<div><label>Tracking Code</label><span id="s-code"></span></div>
			<div><label>Test</label><span id="s-test"></span></div>
			<div><label>Status</label><strong id="s-status"></strong></div>
			<div><label>Lab</label><span id="s-lab"></span></div>
			<div><label>Received</label><span id="s-recv"></span></div>
			<div><label>Dispatched</label><span id="s-disp"></span></div>
			<div><label>Testing Started</label><span id="s-start"></span></div>
			<div><label>Report Available</label><span id="s-rep"></span></div>
		</div>
		<div id="s-steps" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;"></div>
	</div>
	<div id="ic-error" style="display:none;color:#b00020;"></div>
</div></div></div>
<script>
const code = {{ code|tojson }};
const STEPS = ['Awaiting Sample','Sample Received','Dispatched to Lab','Testing In Process','Report Available','Report Uploaded','Shared with Customer'];
frappe.ready(() => {
	frappe.call({
		method: 'instacertify.api.testing.get_sample',
		args: { code },
		callback(r) {
			const d = r.message;
			document.getElementById('ic-loading').style.display='none';
			document.getElementById('ic-content').style.display='block';
			document.getElementById('s-title').textContent = d.title;
			document.getElementById('s-code').textContent = d.tracking_code;
			document.getElementById('s-test').textContent = d.test_name;
			document.getElementById('s-status').textContent = d.sample_status;
			document.getElementById('s-lab').textContent = d.lab || '—';
			document.getElementById('s-recv').textContent = d.sample_received_on || '—';
			document.getElementById('s-disp').textContent = d.dispatched_to_lab_on || '—';
			document.getElementById('s-start').textContent = d.testing_started_on || '—';
			document.getElementById('s-rep').textContent = d.report_available_on || '—';
			const idx = STEPS.indexOf(d.sample_status);
			const box = document.getElementById('s-steps');
			STEPS.forEach((step, i) => {
				const el = document.createElement('div');
				el.textContent = step;
				el.style.cssText = 'padding:8px 10px;border-radius:999px;font-size:12px;font-weight:700;' +
					(i <= idx ? 'background:#0B5FFF;color:#fff;' : 'background:#e8eef8;color:#5b677a;');
				box.appendChild(el);
			});
		},
		error() {
			document.getElementById('ic-loading').style.display='none';
			document.getElementById('ic-error').style.display='block';
			document.getElementById('ic-error').textContent='Sample not found.';
		}
	});
});
</script>
{% endblock %}
