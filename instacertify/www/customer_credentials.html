{% extends "templates/web.html" %}
{% block title %}Customer Login Credentials — InstaCertify{% endblock %}
{% block page_content %}
<link rel="stylesheet" href="/assets/instacertify/css/instacertify_web.css">
<div class="ic-portal"><div class="ic-portal-shell">
  <div class="ic-portal-brand"><div class="logo">InstaCertify</div><div>Shared Login Credentials</div></div>
  <div class="ic-portal-card">
    <div id="loading">Loading…</div>
    <div id="content" style="display:none">
      <h1 id="customer"></h1>
      <p>Project: <b id="project"></b> · Status: <b id="status"></b></p>
      <div id="box" class="ic-meta"></div>
      <p id="msg"></p>
      <p><a id="portal" class="ic-btn ic-btn-accept" href="#" target="_blank">Open Project Portal</a></p>
    </div>
    <div id="error" style="display:none;color:#b00020"></div>
  </div>
</div></div>
<script>
const token={{ token|tojson }};
frappe.ready(()=>{
  frappe.call({
    method:'instacertify.api.portal.get_shared_credentials',
    args:{token},
    callback(r){
      const d=r.message;
      document.getElementById('loading').style.display='none';
      document.getElementById('content').style.display='block';
      document.getElementById('customer').textContent=d.customer_name;
      document.getElementById('project').textContent=d.project;
      document.getElementById('status').textContent=d.project_status;
      document.getElementById('msg').textContent=d.message;
      const box=document.getElementById('box');
      box.innerHTML=`<div><label>Login Email</label><span>${frappe.utils.escape_html(d.email||'')}</span></div>
        <div><label>Password</label><span>${d.reveal?frappe.utils.escape_html(d.password||''):'Hidden until project complete'}</span></div>`;
      if(d.portal_link){ document.getElementById('portal').href=d.portal_link; }
    },
    error(){
      document.getElementById('loading').style.display='none';
      document.getElementById('error').style.display='block';
      document.getElementById('error').textContent='Invalid credentials link.';
    }
  });
});
</script>
{% endblock %}
